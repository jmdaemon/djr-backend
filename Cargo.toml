[package]
name = "djr-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "list-customer"
path = "src/bin/list-customer.rs"

[dependencies]
actix-web = "4.11.0"
chrono = { version = "0.4.41", features = ["serde"] }
diesel = { version = "2.2.12", features = ["chrono", "mysql", "r2d2"] }
dotenv = "0.15.0"
serde = { version = "1.0.219", features = ["derive"] }
simple_logger = "5.0.0"
uuid = { version = "1.17.0", features = ["v4"] }
